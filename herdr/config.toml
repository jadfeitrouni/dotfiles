onboarding = false
[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
agent_panel_sort = "spaces"

# Ctrl+H/J/K/L: switch panes, but pass the key through to vim/nvim and fzf
# (see navigate.sh; nvim's side lives in nvim/lua/config/keymaps.lua)
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/navigate.sh left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/navigate.sh down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/navigate.sh up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/navigate.sh right"
